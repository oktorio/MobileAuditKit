[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mobileauditkit"
version = "0.5.0"
description = "OWASP-aligned mobile application security assessment toolkit with Frida-based dynamic instrumentation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "MobileAuditKit contributors"}]
dependencies = [
  "frida>=16.0",
  "frida-tools>=12.0",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "PyYAML>=6.0",
  "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pip-audit>=2.7",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
mobileauditkit = "mobileauditkit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mobileauditkit"]

[tool.hatch.build]
include = [
  "src/mobileauditkit/**/*.py",
  "src/mobileauditkit/agents/*.js",
  "src/mobileauditkit/mappings/*.yaml",
  "src/mobileauditkit/profiles/*.yaml",
  "src/mobileauditkit/registry/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
check_untyped_defs = true
